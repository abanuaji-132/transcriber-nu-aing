<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Indonesian Audio/Video Transcriber</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 750px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    .card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 20px; }
    label { font-weight: 600; display: block; margin-bottom: 8px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background-color: #0969da; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
    button:disabled { background-color: #94d3a2; cursor: not-allowed; }
    #status { margin: 15px 0; font-weight: bold; color: #0969da; }
    #transcript { background: #f6f8fa; padding: 16px; border-radius: 6px; min-height: 120px; max-height: 400px; overflow-y: auto; border: 1px solid #d0d7de; }
    .segment { margin-bottom: 12px; }
    .time { font-family: monospace; color: #0550ae; font-weight: bold; margin-right: 8px; background: #ddf4ff; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Transkrip Audio / Video (Local Backend)</h2>
  
  <div class="form-group">
    <label for="serverUrl">Local Backend Proxy URL:</label>
    <input type="text" id="serverUrl" placeholder="e.g. https://your-ngrok-url.ngrok-free.app or http://localhost:3000" />
    <small style="color: #666;">Masukkan URL reverse proxy ke machine lokal Anda.</small>
  </div>

  <div class="form-group">
    <label for="mediaFile">Upload File Audio/Video:</label>
    <input type="file" id="mediaFile" accept="audio/*,video/*" />
  </div>

  <button id="uploadBtn">Mulai Transkripsi</button>

  <div id="status"></div>

  <h3>Hasil Transkrip:</h3>
  <div id="transcript">Unggah file untuk memulai transkripsi.</div>
</div>

<script>
  const serverUrlInput = document.getElementById('serverUrl');
  const fileInput = document.getElementById('mediaFile');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');

  // Preserve local URL state
  serverUrlInput.value = localStorage.getItem('local_backend_url') || 'http://localhost:3000';
  serverUrlInput.addEventListener('input', () => {
    localStorage.setItem('local_backend_url', serverUrlInput.value.trim());
  });

  function formatTime(seconds) {
    const totalSecs = Math.floor(seconds || 0);
    const hh = String(Math.floor(totalSecs / 3600)).padStart(2, '0');
    const mm = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, '0');
    const ss = String(totalSecs % 60).padStart(2, '0');
    return `${hh}:${mm}:${ss}`;
  }

  uploadBtn.addEventListener('click', async () => {
    let baseUrl = serverUrlInput.value.trim().replace(/\/$/, "");
    const file = fileInput.files[0];

    if (!baseUrl) {
      alert('Masukkan URL backend lokal!');
      return;
    }
    if (!file) {
      alert('Pilih file audio/video terlebih dahulu!');
      return;
    }

    const formData = new FormData();
    formData.append('media', file);

    try {
      uploadBtn.disabled = true;
      statusEl.textContent = 'Mengirim file ke server lokal...';

      const response = await fetch(`${baseUrl}/api/transcribe`, {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error(`Server response error: ${response.statusText}`);
      }

      statusEl.textContent = 'Memproses transkripsi di lokal machine...';
      const data = await response.json();

      statusEl.textContent = 'Transkripsi Selesai!';
      transcriptEl.innerHTML = '';

      if (data.chunks && data.chunks.length > 0) {
        data.chunks.forEach(chunk => {
          const startTime = formatTime(chunk.timestamp[0]);
          const endTime = formatTime(chunk.timestamp[1]);
          
          const div = document.createElement('div');
          div.className = 'segment';
          div.innerHTML = `<span class="time">[${startTime} - ${endTime}]</span> ${chunk.text}`;
          transcriptEl.appendChild(div);
        });
      } else {
        transcriptEl.textContent = data.text || 'Tidak ada teks terdeteksi.';
      }

    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
    } finally {
      uploadBtn.disabled = false;
    }
  });
</script>

</body>
</html>
